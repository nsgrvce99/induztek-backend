spring.application.name=api-gateway
server.port=8080
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
spring.cloud.gateway.server.webflux.discovery.locator.enabled=false
spring.cloud.gateway.server.webflux.httpclient.connect-timeout=2000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=15s
spring.cloud.gateway.server.webflux.routes[0].id=ms-usuarios
spring.cloud.gateway.server.webflux.routes[0].uri=lb://ms-usuarios
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**,/api/usuarios/**,/api/clientes/**,/api/roles/**
spring.cloud.gateway.server.webflux.routes[1].id=ms-equipos
spring.cloud.gateway.server.webflux.routes[1].uri=lb://ms-equipos
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/equipos/**,/api/instalaciones/**
spring.cloud.gateway.server.webflux.routes[2].id=ms-instrumentos
spring.cloud.gateway.server.webflux.routes[2].uri=lb://ms-instrumentos
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/instrumentos/**
spring.cloud.gateway.server.webflux.routes[3].id=ms-protocolos
spring.cloud.gateway.server.webflux.routes[3].uri=lb://ms-protocolos
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/protocolos/**
management.endpoints.web.exposure.include=health
