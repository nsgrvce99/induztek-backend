spring.application.name=ms-instrumentos
server.port=8083
spring.datasource.url=${DB_INSTRUMENTOS_URL:jdbc:mysql://localhost:3306/induztek_instrumentos}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.mvc.problemdetails.enabled=true
spring.data.web.pageable.max-page-size=100
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
spring.cloud.openfeign.client.config.ms-usuarios.connect-timeout=2000
spring.cloud.openfeign.client.config.ms-usuarios.read-timeout=3000
