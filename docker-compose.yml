x-eureka-cliente: &eureka-cliente
  EUREKA_URL: http://eureka-server:8761/eureka/
  SPRING_APPLICATION_JSON: >-
    {"eureka":{"client":{"registry-fetch-interval-seconds":3},"instance":{"prefer-ip-address":true}},"spring":{"cloud":{"loadbalancer":{"cache":{"enabled":false}}}}}

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?configura MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: induztek_usuarios
      MYSQL_USER: induztek
      MYSQL_PASSWORD: ${DB_PASSWORD:?configura DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/010_usuarios_esquema_roles.sql:/docker-entrypoint-initdb.d/010_usuarios_esquema_roles.sql:ro
      - ./database/020_equipos_esquema.sql:/docker-entrypoint-initdb.d/020_equipos_esquema.sql:ro
      - ./database/021_equipos_datos.sql:/docker-entrypoint-initdb.d/021_equipos_datos.sql:ro
      - ./database/030_instrumentos.sql:/docker-entrypoint-initdb.d/030_instrumentos.sql:ro
      - ./database/040_protocolos_esquema.sql:/docker-entrypoint-initdb.d/040_protocolos_esquema.sql:ro
      - ./database/050_formato_y_archivos.sql:/docker-entrypoint-initdb.d/050_formato_y_archivos.sql:ro
      - ./database/090_docker_permisos.sql:/docker-entrypoint-initdb.d/090_docker_permisos.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "--protocol=tcp", "-h", "127.0.0.1", "ping", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  eureka-server:
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    environment:
      SPRING_APPLICATION_JSON: '{"eureka":{"server":{"response-cache-update-interval-ms":2000}}}'
    healthcheck:
      test: ["CMD", "bash", "-c", "true >/dev/tcp/127.0.0.1/8761"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  ms-usuarios:
    build:
      context: .
      dockerfile: ms-usuarios/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      <<: *eureka-cliente
      DB_USUARIOS_URL: jdbc:mysql://mysql:3306/induztek_usuarios
      DB_USERNAME: induztek
      DB_PASSWORD: ${DB_PASSWORD:?configura DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?configura JWT_SECRET}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      DEMO_PASSWORD_1: ${DEMO_PASSWORD_1:-}
      DEMO_PASSWORD_2: ${DEMO_PASSWORD_2:-}
      DEMO_PASSWORD_3: ${DEMO_PASSWORD_3:-}
      DEMO_PASSWORD_4: ${DEMO_PASSWORD_4:-}
      DEMO_PASSWORD_5: ${DEMO_PASSWORD_5:-}
    healthcheck:
      test: ["CMD", "bash", "-c", "true >/dev/tcp/127.0.0.1/8081"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  ms-equipos:
    build:
      context: .
      dockerfile: ms-equipos/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      <<: *eureka-cliente
      DB_EQUIPOS_URL: jdbc:mysql://mysql:3306/induztek_equipos
      DB_USERNAME: induztek
      DB_PASSWORD: ${DB_PASSWORD:?configura DB_PASSWORD}
    healthcheck:
      test: ["CMD", "bash", "-c", "true >/dev/tcp/127.0.0.1/8082"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  ms-instrumentos:
    build:
      context: .
      dockerfile: ms-instrumentos/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      <<: *eureka-cliente
      DB_INSTRUMENTOS_URL: jdbc:mysql://mysql:3306/induztek_instrumentos
      DB_USERNAME: induztek
      DB_PASSWORD: ${DB_PASSWORD:?configura DB_PASSWORD}
    healthcheck:
      test: ["CMD", "bash", "-c", "true >/dev/tcp/127.0.0.1/8083"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  ms-protocolos:
    build:
      context: .
      dockerfile: ms-protocolos/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      <<: *eureka-cliente
      DB_PROTOCOLOS_URL: jdbc:mysql://mysql:3306/induztek_protocolos
      DB_USERNAME: induztek
      DB_PASSWORD: ${DB_PASSWORD:?configura DB_PASSWORD}
    healthcheck:
      test: ["CMD", "bash", "-c", "true >/dev/tcp/127.0.0.1/8084"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    depends_on:
      eureka-server:
        condition: service_healthy
      ms-usuarios:
        condition: service_healthy
      ms-equipos:
        condition: service_healthy
      ms-instrumentos:
        condition: service_healthy
      ms-protocolos:
        condition: service_healthy
    environment:
      <<: *eureka-cliente
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "true >/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

volumes:
  mysql-data:

